plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'panomete'
version = '0.0.1-SNAPSHOT'
description = 'flowerogate'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.2")
}

dependencies {
    // ── Gateway core (reactive / Netty) ──
    // Spring Cloud 2025.1.0 (Oakwood): renamed from spring-cloud-starter-gateway
    implementation 'org.springframework.cloud:spring-cloud-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // ── Security (reactive — Security 7 / Boot 4) ──
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // OAuth2 Resource Server — JWT validation via Keycloak
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // ── Redis (reactive, for rate limiting) ──
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // ── Actuator ──
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── Circuit Breaker (Resilience4j) ──
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // ── LoadBalancer (for lb:// URIs) ──
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // ── Service Discovery (Eureka — optional, disable via profile if not needed) ──
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // ── Observability ──
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-starter-micrometer-metrics'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'io.micrometer:micrometer-registry-otlp'

    // ── Resilience4j Micrometer (circuit breaker metrics) ──
    runtimeOnly 'io.github.resilience4j:resilience4j-micrometer'

    // ── Tests ──
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
