# ── Test profile ──
spring:
  cloud:
    gateway:
      routes:
        - id: test-route
          uri: ${test.upstream.uri:http://localhost:18180}
          order: 1
          predicates:
            - Path=/api/v1/test/**
          filters:
            - StripPrefix=3
            - RemoveRequestHeader=Authorization
            - AddRequestHeader=X-Gateway-Route,echo-service

        - id: fallback-404
          uri: forward:/fallback/not-found
          order: 9999
          predicates:
            - Path=/**

    loadbalancer:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/flowerogate
          jwk-set-uri: http://localhost:9000/realms/flowerogate/protocol/openid-connect/certs

  data:
    redis:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

eureka:
  client:
    enabled: false

logging:
  level:
    root: WARN
    panomete.flowerogate: DEBUG
    org.springframework.cloud.gateway: DEBUG
