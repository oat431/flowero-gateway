# ── Test profile ──
app:
  post-login-redirect-url: https://panomete.com

spring:
  cloud:
    gateway:
      routes:
        - id: test-route
          uri: ${test.upstream.uri:http://localhost:18180}
          order: 1
          predicates:
            - Path=/api/v1/test/**
          filters:
            - StripPrefix=3
            - RemoveRequestHeader=Authorization
            - AddRequestHeader=X-Gateway-Route,echo-service

        - id: fallback-404
          uri: forward:/fallback/not-found
          order: 9999
          predicates:
            - Path=/**

    loadbalancer:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/panomete
          jwk-set-uri: http://localhost:9000/realms/panomete/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: flowero-gateway
            client-secret: test-secret-do-not-use-in-prod
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            # No issuer-uri — use explicit endpoints to avoid OIDC metadata fetch
            authorization-uri: http://localhost:9000/realms/panomete/protocol/openid-connect/auth
            token-uri: http://localhost:9000/realms/panomete/protocol/openid-connect/token
            user-info-uri: http://localhost:9000/realms/panomete/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:9000/realms/panomete/protocol/openid-connect/certs
            user-name-attribute: preferred_username

  data:
    redis:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

eureka:
  client:
    enabled: false

logging:
  level:
    root: WARN
    panomete.flowerogate: DEBUG
    org.springframework.cloud.gateway: DEBUG
