# ═══════════════════════════════════════════════════════════════
#  Flowerogate — Spring Cloud Gateway (Boot 4 / Cloud 2025.x)
# ═══════════════════════════════════════════════════════════════

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  netty:
    connection-timeout: 30s

spring:
  application:
    name: flowero-gate

  # ── Graceful shutdown ──
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ── Don't start Eureka unless profile activates it ──
  cloud:
    gateway:
      # ── Global CORS ──
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "https://*.panomete.com"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "Authorization,Content-Type,X-API-Key,X-Request-ID"
            exposedHeaders: "X-Trace-Id,X-RateLimit-Remaining,X-RateLimit-Replenish-Rate,X-RateLimit-Burst-Capacity"
            allowCredentials: true
            maxAge: 3600

      # ── HTTP Client (Netty) ──
      httpclient:
        response-timeout: 30s
        connect-timeout: 5000
        max-header-size: 16KB
        max-initial-line-length: 8KB

      # ── Routes ──
      # All business API routes follow the /api/{service}/** pattern.
      # StripPrefix=1 removes /api before forwarding to the backend.
      # Authentication and rate limiting are applied globally.
      routes:

        # ── Cute Gufo (Blog) ──
        - id: blog
          uri: lb://cute-gufo
          predicates:
            - Path=/api/blog/**
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        # ── Fluffy Mouton (URL Shortener) ──
        - id: short
          uri: lb://fluffy-mouton
          predicates:
            - Path=/api/short/**
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        # ── Tiny Mchwa (Todo) ──
        - id: todo
          uri: lb://tiny-mchwa
          predicates:
            - Path=/api/todo/**
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        # ── Future routes (Phase 2+) ──
        # - id: ledger
        #   uri: lb://big-schwein
        #   predicates: [Path=/api/ledger/**]
        #   filters:
        #     - StripPrefix=1
        #
        # - id: recipe
        #   uri: lb://shy-ardilla
        #   predicates: [Path=/api/recipe/**]
        #   filters:
        #     - StripPrefix=1
        #
        # - id: hora
        #   uri: lb://white-jelen
        #   predicates: [Path=/api/hora/**]
        #   filters:
        #     - StripPrefix=1

        # ── TEMPLATE: Authenticated service with full filter stack ──
        # - id: my-service
        #   uri: lb://my-service
        #   order: 10
        #   predicates:
        #     - Path=/api/v1/my-service/**
        #   filters:
        #     - StripPrefix=1
        #     - RemoveRequestHeader=Authorization
        #     - name: RequestRateLimiter
        #       args:
        #         key-resolver: "#{@principalKeyResolver}"
        #         redis-rate-limiter.replenishRate: 100
        #         redis-rate-limiter.burstCapacity: 200
        #     - name: CircuitBreaker
        #       args:
        #         name: myServiceCircuitBreaker
        #         fallbackUri: forward:/fallback/my-service
        #     - name: Retry
        #       args:
        #         retries: 3
        #         statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
        #         methods: GET
        #         backoff:
        #           firstBackoff: 50ms
        #           maxBackoff: 500ms
        #           factor: 2

        # ── Catch-all (standardized 404) ──
        - id: fallback-404
          uri: forward:/fallback/not-found
          order: 9999
          predicates:
            - Path=/**

    # ── LoadBalancer ──
    loadbalancer:
      enabled: true
      ribbon:
        enabled: false   # explicitly disable deprecated Ribbon

  # ── Security: OAuth2 Resource Server (JWT) ──
  # Override per-profile (dev uses localhost:9000, prod uses env vars)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.panomete.com/realms/panomete
          jwk-set-uri: https://auth.panomete.com/realms/panomete/protocol/openid-connect/certs

  # ── Redis (reactive, for rate limiting) ──
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2s

  # ── Codec (request size limit) ──
  codec:
    max-in-memory-size: 10MB

# ═══════════════════════════════════════════════════════════════
#  Actuator (separate management port)
# ═══════════════════════════════════════════════════════════════
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
      otlp:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: flowero-gate

