# ── Production profile ──
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:https://app.example.com}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: flowero-gateway
            client-secret: ${KEYCLOAK_GATEWAY_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${JWT_ISSUER_URI}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
      connect-timeout: 1s
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8
          max-wait: 2s

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka:8761/eureka}
    registry-fetch-interval-seconds: 30
    initial-instance-info-replication-interval-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      otlp:
        enabled: ${OTLP_ENABLED:true}
        endpoint: ${OTLP_ENDPOINT:http://otel-collector:4318/v1/metrics}
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

logging:
  pattern:
    console: "{\"timestamp\":\"%d{yyyy-MM-dd HH:mm:ss.SSS}\",\"level\":\"%-5level\",\"logger\":\"%logger{36}\",\"thread\":\"%thread\",\"traceId\":\"%X{traceId:-}\",\"spanId\":\"%X{spanId:-}\",\"message\":\"%msg\"}%n"
  level:
    root: WARN
    panomete.flowerogate: INFO
    org.springframework.cloud.gateway: INFO
