# ── Dev profile — local development ──
server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000,http://localhost:5173"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/panomete
          jwk-set-uri: http://localhost:9000/realms/panomete/protocol/openid-connect/certs

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    enabled: false

logging:
  level:
    root: INFO
    panomete.flowerogate: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.security: DEBUG

management:
  endpoint:
    health:
      show-details: always
