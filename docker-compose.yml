services:
  gateway:
    # Pull from Docker Hub after local build + push:
    #   docker build -t panomete/flowerogate:latest .
    #   docker push panomete/flowerogate:latest
    image: oat431/flowerogate:latest
    container_name: flowerogate
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"     # API gateway (nginx proxies this)
    environment:
      # ── Server ──
      SERVER_PORT: "8000"
      MANAGEMENT_SERVER_PORT: "-1"    # actuator on same port

      # ── Spring profile ──
      SPRING_PROFILES_ACTIVE: prod

      # ── OAuth2 / JWT ──
      JWT_ISSUER_URI: https://auth.panomete.com/realms/flowerogate
      JWT_JWK_SET_URI: https://auth.panomete.com/realms/flowerogate/protocol/openid-connect/certs

      # ── Redis (native on host) ──
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ***
      REDIS_SSL: "false"

      # ── Resilience4j (disabled — no circuit breaker instances configured) ──
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.cloud.circuitbreaker.resilience4j.Resilience4JAutoConfiguration

      # ── Eureka (disabled — no service registry yet) ──
      EUREKA_CLIENT_ENABLED: "false"

      # ── OTLP (disabled — no collector yet) ──
      OTLP_ENABLED: "false"

      # ── Logging ──
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_PANOMETE_FLOWEROGATE: DEBUG

      # ── Body logging on 5xx (opt-in) ──
      # GATEWAY_LOGGING_LOG_BODIES_ON_ERROR: "true"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ── Resource limits ──
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    # ── Health check ──
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
